# this_file: .github/workflows/pypi-upload.yml
name: PyPI upload
run-name: PyPI upload ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag of the GitHub release holding the wheel and sdist
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-upload-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download the release distributions
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected stable semantic tag vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          published=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not')
          if [[ "$published" != true ]]; then
            echo "Expected a published stable GitHub release for $RELEASE_TAG" >&2
            exit 1
          fi
          stem="vexy_audioflexy-${RELEASE_TAG#v}"
          wheel="$stem-py3-none-any.whl"
          sdist="$stem.tar.gz"
          gh release download "$RELEASE_TAG" --pattern "$wheel" --pattern "$sdist" --dir dist
          test -s "dist/$wheel"
          test -s "dist/$sdist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: fetch
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Publish with PyPI Trusted Publishing
        env:
          UV_HTTP_RETRIES: "0"
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*.whl dist/*.tar.gz
